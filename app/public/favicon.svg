<svg
  viewBox="0 0 48 48"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
  focusable="false"
>
  <!--
    DiffSentinel mark.
    Two staggered diff bars — the shorter red-tinted bar is the removed line,
    the longer green-tinted bar is the added line — crossed by a vertical
    scanning line that reads as the sentinel's watchful gaze.
  -->
  <rect
    x="6"
    y="14"
    width="26"
    height="6"
    rx="1.5"
    fill="#E5484D"
    fill-opacity="0.9"
  />
  <rect
    x="10"
    y="28"
    width="32"
    height="6"
    rx="1.5"
    fill="#3FB950"
    fill-opacity="0.9"
  />
  <line
    x1="24"
    y1="4"
    x2="24"
    y2="44"
    stroke="#F5A623"
    stroke-width="2"
    stroke-linecap="round"
  />
  <circle cx="24" cy="24" r="2.2" fill="#F5A623" />
</svg>
